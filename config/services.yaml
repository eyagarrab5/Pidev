# config/services.yaml
parameters:
    upload_directory: '%kernel.project_dir%/public/uploads/'
    vehicule_images_directory: '%kernel.project_dir%/public/uploads/vehicules'
    
services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'