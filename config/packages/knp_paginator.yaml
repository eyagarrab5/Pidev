knp_paginator:
    page_range: 5                      # Nombre de pages affichées dans la pagination
    default_options:
        page_name: page                # Nom du paramètre de la page dans l'URL
        sort_field_name: sort          # Nom du paramètre de tri dans l'URL
        sort_direction_name: direction # Nom du paramètre de direction de tri dans l'URL
        distinct: true                 # Utiliser DISTINCT pour éviter les doublons
    template:
        pagination: '@KnpPaginator/Pagination/twitter_bootstrap_v4_pagination.html.twig' # Template par défaut
        pagination_options:
            align: center              # Alignement de la pagination
            size: small                # Taille de la pagination
            style: rounded             # Style des boutons
            span: true                 # Ajouter des spans autour des flèches
        sortable: '@KnpPaginator/Pagination/sortable_link.html.twig'